# 公开行情需要网络；演示数据不代表真实市价。
mode: live
poll_seconds: 30
quote_provider: tencent
provider_uri: null
history:
  enabled: true
  bars: 500
  update_at: "18:30"
# 相对路径相对本配置文件解析，而不是当前工作目录。
database: .runtime/alerts.sqlite3
alerts:
  stock_change: 0.03
  basket_change: 0.01
  turnover: null
  cooldown: 300
  minimum_coverage: 0.95
baskets:
  我的A股篮子:
    symbols: [SH688001, SZ300001, SH600000, SZ000001]
    weights: [1, 1, 1, 1]
