[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "legacy-market-monitor"
version = "0.1.0"
description = "Experimental public-feed A-share monitor preserved for cutover and rollback"
requires-python = ">=3.10"
dependencies = [
  "filelock>=3.16,<4",
  "requests>=2.31,<3",
  "pyyaml>=6,<7",
  "numpy>=1.26,<3",
  "pandas>=2.2,<3",
]

[project.optional-dependencies]
dashboard = ["streamlit>=1.52,<2", "protobuf>=5.26.1,<6"]
qlib = ["pyqlib==0.9.7"]

[dependency-groups]
dev = ["pytest>=8,<10"]

[tool.hatch.build.targets.wheel]
packages = ["legacy_monitor"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"
