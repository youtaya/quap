server {
  listen 8080;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # 压缩：产物里最大的是 JS（约 230KB），gzip 后约 78KB。
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # 同源反代。前端一律用相对路径 `/api/v1`，所以浏览器看到的始终是同一个源，
  # 不需要 CORS，也不存在预检请求。
  location /api/ {
    proxy_pass http://api:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # 训练与推理是异步提交（202），但诊断类接口可能跑满 30 秒，给足超时。
    proxy_read_timeout 120s;
  }

  # 存活探针，登录页用它区分「后端没起来」与「令牌错了」。
  location /health/ {
    proxy_pass http://api:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
  }

  # 容器自身的健康检查用，不打到后端：前端进程活着就该算健康，
  # 后端挂了由页面上的「接口不可用」表达，不该让前端容器被反复重启。
  location = /healthz {
    access_log off;
    return 200 "ok\n";
    add_header Content-Type text/plain;
  }

  # 带内容哈希的产物可以长期缓存。
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # SPA 路由：`/today`、`/pipeline` 这些路径在磁盘上没有对应文件，交给 index.html 处理。
  # index.html 本身不缓存，否则发版后用户会一直拿到旧的入口文件。
  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache";
  }

  # 令牌与业务数据都不该出现在 URL 里，所以不记查询串。
  access_log /var/log/nginx/access.log;
  server_tokens off;
}
